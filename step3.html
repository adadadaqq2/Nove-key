<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nove | Your Key</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Space Grotesk',sans-serif;background:#0B0A0F;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:24px;}
        .bg{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at 30% 40%,rgba(139,92,246,0.15)0%,transparent 50%),radial-gradient(circle at 80% 70%,rgba(6,182,212,0.1)0%,transparent 50%);z-index:0;}
        .container{position:relative;z-index:2;max-width:500px;width:100%;}
        .card{background:rgba(18,17,23,0.9);backdrop-filter:blur(20px);border-radius:48px;border:1px solid rgba(255,255,255,0.08);padding:48px 40px;text-align:center;box-shadow:0 32px 64px -24px rgba(0,0,0,0.5);}
        .logo{width:70px;height:70px;background:linear-gradient(135deg,#8B5CF6,#06B6D4);border-radius:24px;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;}
        h1{font-size:2rem;font-weight:700;background:linear-gradient(135deg,#FFF,#A855F7,#06B6D4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px;}
        .badge{display:inline-block;background:rgba(16,185,129,0.15);border:1px solid rgba(16,185,129,0.3);border-radius:100px;padding:6px 16px;font-size:0.7rem;color:#10B981;margin-bottom:32px;}
        h2{font-size:1.5rem;color:white;margin-bottom:16px;}
        .key-box{background:rgba(0,0,0,0.4);border-radius:24px;padding:20px;border:1px solid rgba(139,92,246,0.3);margin:24px 0;}
        .key-value{font-family:monospace;font-size:1.2rem;font-weight:700;background:rgba(0,0,0,0.5);padding:14px;border-radius:16px;color:#A855F7;word-break:break-all;letter-spacing:1px;}
        .btn{width:100%;padding:16px;border-radius:24px;font-weight:600;font-size:0.9rem;border:none;cursor:pointer;background:linear-gradient(135deg,#10B981,#059669);color:white;transition:all 0.2s;margin-top:16px;}
        .btn:hover{transform:translateY(-2px);}
        .loader{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,0.3);border-radius:50%;border-top-color:white;animation:spin 0.8s linear infinite;margin-right:10px;vertical-align:middle;}
        @keyframes spin{to{transform:rotate(360deg);}}
        .status{font-size:0.75rem;color:#6B6A7A;margin-top:16px;}
        .footer{margin-top:24px;font-size:0.7rem;color:#4A4A5A;text-align:center;}
        .hidden{display:none;}
    </style>
</head>
<body>
<div class="bg"></div>
<div class="container">
    <div class="card">
        <div class="logo"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="white" stroke-width="1.5"/><path d="M2 17L12 22L22 17" stroke="white" stroke-width="1.5"/><path d="M2 12L12 17L22 12" stroke="white" stroke-width="1.5"/></svg></div>
        <h1>NOVE</h1>
        <div class="badge">✓ VERIFIED</div>
        <h2>Your Key Is Ready</h2>
        
        <div class="key-box">
            <div class="key-value" id="keyValue">Loading...</div>
            <button class="btn" id="copyBtn">📋 Copy to Clipboard</button>
        </div>
        <div class="status" id="statusMsg"></div>
        <div class="footer">© 2024 Nove Key System • Key valid for 24 hours</div>
    </div>
</div>
<script>
    // ========== PASTEBIN RAW LINKIN (KEY LISTESI) ==========
    const PASTEBIN_URL = "https://pastebin.com/raw/PASTE_RAW_LINKINI_BURAYA_YAZ";
    
    async function getKeyFromPastebin() {
        try {
            const response = await fetch(PASTEBIN_URL);
            const data = await response.text();
            
            // Key'leri satır satır al
            const keys = data.split('\n').filter(k => k.trim().length > 10);
            
            if (keys.length === 0) {
                document.getElementById('keyValue').textContent = "NO KEYS AVAILABLE";
                document.getElementById('statusMsg').innerHTML = "❌ Key listesi bos! Yoneticiye ulasin.";
                return;
            }
            
            // İlk key'i al (ve kullanıldı olarak işaretlemek için)
            const firstKey = keys[0].trim();
            document.getElementById('keyValue').textContent = firstKey;
            document.getElementById('statusMsg').innerHTML = "✅ Key alindi! Scripte yapistir.";
            
            // KULLANILAN KEY'İ PASTEBİN'DEN KALDIRMAK İÇİN:
            // Maalesef Pastebin API'si olmadan yapamayız.
            // O yüzden aynı key birden fazla kişi alabilir.
            // Çözüm: Her kullanıcıya farklı key vermek için backend şart.
            
        } catch (error) {
            document.getElementById('keyValue').textContent = "ERROR";
            document.getElementById('statusMsg').innerHTML = "❌ Baglanti hatasi! Tekrar dene.";
        }
    }
    
    // Copy butonu
    document.getElementById('copyBtn').addEventListener('click', () => {
        const keyText = document.getElementById('keyValue').textContent;
        navigator.clipboard.writeText(keyText);
        const btn = document.getElementById('copyBtn');
        btn.innerHTML = "✓ COPIED!";
        setTimeout(() => {
            btn.innerHTML = "📋 Copy to Clipboard";
        }, 2000);
    });
    
    // Sayfa yüklenince key'i al
    getKeyFromPastebin();
</script>
</body>
</html>
